name: Windows CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/AgentHud.Desktop/AgentHud.Desktop.csproj

      - name: Build
        run: dotnet build src/AgentHud.Desktop/AgentHud.Desktop.csproj --configuration Release --no-restore
